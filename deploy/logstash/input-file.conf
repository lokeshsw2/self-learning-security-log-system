# Local test input: read a file once from the start.
input {
  file {
    path           => "${LP_INPUT}"
    mode           => "read"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    exit_after_read => true
    file_completed_action => "log"
    file_completed_log_path => "/dev/null"
    codec          => plain { charset => "UTF-8" }
  }
}
