# Production: unparsed lines also go to the topic the learner (logparser) consumes.
output {
  if "lp_unparsed" in [tags] {
    kafka {
      bootstrap_servers => "${KAFKA_BOOTSTRAP:localhost:9092}"
      topic_id          => "${UNPARSED_TOPIC:raw-logs-unparsed}"
      codec             => plain { format => "%{message}" }
    }
  }
}
