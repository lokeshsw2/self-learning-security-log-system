# Flatten each OCSF event into ClickHouse columns, then batch-insert over HTTP.
# Parsed events -> logs.ocsf_events; unparsed lines -> logs.unparsed (and, in production,
# also to a Kafka topic the learner reads; see output-kafka-unparsed.conf).
filter {
  if "lp_unparsed" in [tags] {
    mutate { add_field => { "reason" => "%{[lp][reason]}" } }
  } else {
    ruby {
      code => '
        o = event.get("ocsf") || {}
        dig = lambda { |*ks| ks.reduce(o) { |h, k| h.is_a?(Hash) ? h[k] : nil } }
        t = o["time"]
        if t.is_a?(Numeric)
          event.set("time", Time.at(t / 1000.0).utc.strftime("%Y-%m-%d %H:%M:%S.%L"))
        else
          event.set("time", event.get("@timestamp").time.utc.strftime("%Y-%m-%d %H:%M:%S.%L"))
        end
        %w[class_uid category_uid activity_id type_uid severity_id status_id action_id disposition_id].each do |k|
          event.set(k, o[k] || 0)
        end
        event.set("src_ip",  dig.call("src_endpoint", "ip").to_s)
        event.set("dst_ip",  dig.call("dst_endpoint", "ip").to_s)
        event.set("user_name", (dig.call("actor", "user", "name") || dig.call("user", "name") || "").to_s)
        event.set("vendor_name",  dig.call("metadata", "product", "vendor_name").to_s)
        event.set("product_name", dig.call("metadata", "product", "name").to_s)
        lp = event.get("lp") || {}
        event.set("lp_source", lp["source"].to_s)
        event.set("lp_group_id", lp["group_id"].to_s)
        event.set("lp_parser_version", lp["parser_version"].to_i)
        event.set("lp_mapping_version", lp["mapping_version"].to_i)
        event.set("event_json", o.to_json)
      '
    }
  }
}
output {
  if "lp_unparsed" in [tags] {
    http {
      url          => "${CLICKHOUSE_URL:http://localhost:8123}/?input_format_skip_unknown_fields=1&query=INSERT%20INTO%20logs.unparsed%20FORMAT%20JSONEachRow"
      http_method  => "post"
      format       => "json_batch"
      retry_failed => true
    }
  } else {
    http {
      url          => "${CLICKHOUSE_URL:http://localhost:8123}/?input_format_skip_unknown_fields=1&date_time_input_format=best_effort&query=INSERT%20INTO%20logs.ocsf_events%20FORMAT%20JSONEachRow"
      http_method  => "post"
      format       => "json_batch"
      retry_failed => true
    }
  }
}
