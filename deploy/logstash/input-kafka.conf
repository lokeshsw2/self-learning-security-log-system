# Production input: the mixed raw topic. No vendor name is needed; routing is by content.
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:localhost:9092}"
    topics            => ["${RAW_TOPIC:raw-logs}"]
    group_id          => "logstash-ocsf"
    codec             => plain { charset => "UTF-8" }
    consumer_threads  => 4
  }
}
