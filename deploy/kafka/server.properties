# Single-node Kafka (KRaft) for local testing of the learning service. Data lives in work/kafka (git-ignored).
# Ports 19092/19093 on 127.0.0.1 only: another Kafka (Docker, logdiscovery-kafka) publishes 9092 on this Mac.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:19093
listeners=PLAINTEXT://127.0.0.1:19092,CONTROLLER://127.0.0.1:19093
advertised.listeners=PLAINTEXT://127.0.0.1:19092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=/Users/sunny/code/tt/log-analyis-fable-2/work/kafka/data
num.partitions=4
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
log.retention.hours=72
auto.create.topics.enable=false
